<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIフォーム営業エージェント | BANTEX</title>
  <meta name="description" content="AIが企業HPを確認し、送ってよい問い合わせフォームを判定。会社ごとの文面作成、フォーム送信、送信結果と証跡保存まで対応するBANTEXのAIフォーム営業エージェント。">
  <meta property="og:title" content="AIフォーム営業エージェント | BANTEX">
  <meta property="og:description" content="面倒なフォーム営業をAIで実行。試用版30円/件（税抜）。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ai-form.bantex.jp/assets/ai-form-flyer-desktop.webp">
  <meta name="theme-color" content="#f5fbff">
  <link rel="preload" as="image" href="assets/ai-form-flyer-desktop.webp" media="(min-width: 721px)">
  <link rel="preload" as="image" href="assets/ai-form-flyer-mobile.webp" media="(max-width: 720px)">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(36, 169, 210, .14), transparent 34%),
        linear-gradient(180deg, #f7fcff 0%, #eaf4fb 100%);
      color: #061848;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", sans-serif;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 24px);
    }

    .flyer {
      position: relative;
      width: min(100%, 1600px);
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(6, 24, 72, .16);
    }

    .flyer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .hotspot {
      position: absolute;
      z-index: 2;
      display: block;
      border-radius: 8px;
      outline-offset: -4px;
    }

    .hotspot:focus-visible {
      outline: 3px solid #061848;
    }

    .hotspot-line {
      left: 54%;
      right: 22%;
      top: 88%;
      bottom: 1.8%;
    }

    .hotspot-mail {
      left: 76%;
      right: 2%;
      top: 88%;
      bottom: 1.8%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      html,
      body {
        width: 100%;
        max-width: 100%;
        background: #fff;
        overflow-x: hidden;
      }

      .page {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 0;
        padding: 0;
        background: #fff;
        overflow-x: hidden;
      }

      .flyer {
        width: min(100%, 390px);
        max-width: 390px;
        margin: 0;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
      }

      .flyer img {
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      .hotspot-line {
        left: 5%;
        right: 50%;
        top: 89%;
        bottom: 4%;
      }

      .hotspot-mail {
        left: 50%;
        right: 5%;
        top: 89%;
        bottom: 4%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="flyer" aria-label="AIフォーム営業エージェントの案内チラシ">
      <picture>
        <source media="(max-width: 720px)" srcset="assets/ai-form-flyer-mobile.webp" width="900" height="1600">
        <img
          src="assets/ai-form-flyer-desktop.webp"
          width="1600"
          height="900"
          alt="AIフォーム営業エージェント。企業HPを確認し、送ってよいフォームを判定し、会社ごとに文面作成し、送信結果と証跡を保存。試用版30円/件（税抜）。">
      </picture>
      <a class="hotspot hotspot-line" href="https://lin.ee/zpnwwM6" target="_blank" rel="noopener noreferrer">
        <span class="sr-only">LINEで相談</span>
      </a>
      <a class="hotspot hotspot-mail" href="mailto:info@bantex.jp?subject=AIフォーム営業エージェントについて">
        <span class="sr-only">メールで相談</span>
      </a>
    </section>
  </main>
</body>
</html>
